name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rebuild verified ZIP from base64 chunks
        run: |
          cat TimeWallpaper.zip.b64.part0 TimeWallpaper.zip.b64.part1 TimeWallpaper.zip.b64.part2 TimeWallpaper.zip.b64.part3 | base64 --decode > TimeWallpaper.zip
          unzip -tq TimeWallpaper.zip

      - name: Extract Android project
        run: unzip -o TimeWallpaper.zip

      - name: Build debug APK
        working-directory: TimeWallpaper
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWallpaper-apk
          path: TimeWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest TimeWallpaper APK
          files: TimeWallpaper/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
